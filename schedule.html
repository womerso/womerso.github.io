<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Felipa&family=Fleur+De+Leah&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <style>
        @import url('https://googleapis.com');
        * {
            margin-top: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }
    
        .landing {
            margin: 0;
            max-width: 100%;
            height: 100vh;
            display: block;
            background-image: url('./woods-landing.jpg');
            background-position: center;
            background-size: cover;
            transition: cubic-bezier(0.075, 0.82, 0.165, 1);
            mask-image: linear-gradient(to bottom, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 90%, transparent 100%); 
        }
        p {
            text-align: center;
        }
        ul {
            text-align: center;
        }
        li {
            margin-left: 10%;
        }
        .floating {
            display: block;
            margin: 5% auto 3rem auto;
            padding: 40px 20px;
            background-color: whitesmoke;
            width: 80%;
            min-height: 100vh;
            height: auto;
        }
    
        .hero_text {
            display: flex;
            align-items: center;
            flex-direction: column;
            height: 100%;
            justify-content: center;
        }

        .text_center {
            font-size: 60pt;
            color: whitesmoke;
            justify-content: center;
            font-family: 'Fleur De Leah', cursive;
        }

        .luxurious-roman-regular {
            font-family: "PT Serif", serif;
            font-weight: 120;
            height: 1px;
            font-style: regular;
        }

        h3 {
            font-size: 30pt !important;
        }

        h5 {
            font-size: 15pt !important;
        }

        /* Paper Box Container */
        .paper-box {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Set a background color */
        body {
            background-color: #474e5d;
            font-family: "PT Serif", serif;
        }

        /* The actual timeline container */
        .timeline {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }

        /* The vine background line */
        .timeline::after {
            content: '';
            position: absolute;
            width: 40px;
            background-repeat: repeat-y;
            background-image: url('./vine_loop.png');
            background-position: center;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            transition: cubic-bezier(0.075, 0.82, 0.165, 1);
            mask-image: linear-gradient(to bottom, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 90%, transparent 100%);
            mask-image: linear-gradient(to top, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 90%, transparent 100%);
        }

        /* Container around content */
        .container {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
            z-index: 2;
        }

        /* Place the container to the left */
        .left {
            left: 0;
        }

        /* Place the container to the right */
        .right {
            left: 50%;
        }

        /* Add arrows to the left container (pointing right) */
        .left::before {
            content: " ";
            height: 0;
            position: absolute;
            top: 22px;
            width: 0;
            z-index: 1;
            right: 30px;
            border: medium solid white;
            border-width: 10px 0 10px 10px;
            border-color: transparent transparent transparent white;
        }

        /* Add arrows to the right container (pointing left) */
        .right::before {
            content: " ";
            height: 0;
            position: absolute;
            top: 22px;
            width: 0;
            z-index: 1;
            left: 30px;
            border: medium solid white;
            border-width: 10px 10px 10px 0;
            border-color: transparent white transparent transparent;
        }

        /* The actual content */
        .content {
            padding: 20px 30px;
            background-color: white;
            position: relative;
            border-radius: 6px;
        }

        /* Responsive behavior for mobile screens */
        @media screen and (max-width: 600px) {
            .timeline::after {
                left: 31px;
                transform: none;
            }

            .container {
                width: 100%;
                padding-left: 70px;
                padding-right: 25px;
            }

            .left, .right {
                left: 0;
            }

            .container::before {
                left: 60px;
                border: medium solid white;
                border-width: 10px 10px 10px 0;
                border-color: transparent white transparent transparent;
            }
        }
    </style>

    <!-- ============================================================
         ADDED: invitation opening, nav banner, photo frames, note, RSVP
         ============================================================ -->
    <style>
        /* ---------- Smooth scrolling ---------- */
        html {
            scroll-behavior: smooth;
        }
        body.invite-locked {
            overflow: hidden;
        }
        .landing, .floating {
            scroll-margin-top: 4.5rem;
        }
        .floating.compact {
            min-height: 0;
        }

        /* ---------- Unveil curtain (opens like an invitation) ---------- */
        #unveil {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            pointer-events: auto;
        }
        #unveil .panel {
            position: relative;
            width: 50%;
            height: 100%;
            background-color: #474e5d;
            background-image: url('background-watercolor.jpg');
            background-size: cover;
            transition: transform 1.6s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.45);
        }
        #unveil .panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(71, 78, 93, 0.78);
        }
        #unveil .panel.p-left  { transform: translateX(0); }
        #unveil .panel.p-right { transform: translateX(0); }
        #unveil.open .panel.p-left  { transform: translateX(-102%); }
        #unveil.open .panel.p-right { transform: translateX(102%); }

        #unveil .seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            text-align: center;
            color: whitesmoke;
            cursor: pointer;
            background: none;
            border: 0;
            transition: opacity 0.6s ease, transform 0.8s ease;
        }
        #unveil .seal .names {
            display: block;
            font-family: 'Fleur De Leah', cursive;
            font-size: 54pt;
            line-height: 1.1;
            color: whitesmoke;
        }
        #unveil .seal .hint {
            display: block;
            margin-top: 1.25rem;
            font-family: "PT Serif", serif;
            font-style: italic;
            letter-spacing: 0.12em;
            color: whitesmoke;
            animation: unveil-pulse 2.4s ease-in-out infinite;
        }
        #unveil .seal .ring {
            display: block;
            width: 64px;
            height: 64px;
            margin: 1.5rem auto 0;
            border: 2px solid whitesmoke;
            border-radius: 50%;
            position: relative;
            animation: unveil-pulse 2.4s ease-in-out infinite;
        }
        #unveil .seal .ring::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-right: 2px solid whitesmoke;
            border-bottom: 2px solid whitesmoke;
            transform: translate(-50%, -65%) rotate(45deg);
        }
        #unveil.open .seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.15);
            pointer-events: none;
        }
        #unveil.gone {
            display: none;
        }
        @keyframes unveil-pulse {
            0%, 100% { opacity: 0.55; }
            50%      { opacity: 1; }
        }

        /* ---------- Hero fades as you scroll ---------- */
        .hero_text {
            will-change: transform, opacity;
        }
        .scroll-cue {
            position: absolute;
            left: 50%;
            bottom: 7vh;
            transform: translateX(-50%);
            z-index: 3;
            color: whitesmoke;
            font-family: "PT Serif", serif;
            font-style: italic;
            letter-spacing: 0.1em;
            text-align: center;
            text-decoration: none;
            transition: opacity 0.4s ease;
        }
        .scroll-cue span {
            display: block;
            width: 14px;
            height: 14px;
            margin: 0.6rem auto 0;
            border-right: 2px solid whitesmoke;
            border-bottom: 2px solid whitesmoke;
            transform: rotate(45deg);
            animation: cue-bounce 1.8s ease-in-out infinite;
        }
        @keyframes cue-bounce {
            0%, 100% { transform: translateY(0) rotate(45deg); opacity: 0.5; }
            50%      { transform: translateY(8px) rotate(45deg); opacity: 1; }
        }
        .landing { position: relative; }

        /* ---------- Navigation banner (fades in at top while scrolling) ---------- */
        .site-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.25rem;
            padding: 1rem 1.25rem;
            background-color: whitesmoke;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            box-shadow: 0 2px 18px rgba(0, 0, 0, 0.3);
            opacity: 1;
            transform: translateY(-14px);
            pointer-events: auto;
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .site-nav.show {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }
        .site-nav a {
            position: relative;
            padding: 0.25rem 0;
            color: black;
            font-family: "PT Serif", serif;
            font-size: 1rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-decoration: none;
            white-space: nowrap;
        }
        .site-nav a::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -2px;
            height: 2px;
            background-color: #f5c6d3;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.35s ease;
        }
        .site-nav a:hover::after,
        .site-nav a.active::after {
            transform: scaleX(1);
        }

        /* ---------- Portrait picture frames ---------- */
        .gallery {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 2.5rem;
            width: 80%;
            margin: 5% auto 3rem auto;
        }
        .frame {
            position: relative;
            max-width: min(100%, 560px);
            padding: 16px;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
        .frame::after {
            content: '';
            position: absolute;
            inset: 7px;
            border: 1px solid rgba(71, 78, 93, 0.28);
            pointer-events: none;
        }
        .frame img {
            display: block;
            height: 440px;
            width: auto;
            max-width: 100%;
            object-fit: cover;
        }
        .frame .ph {
            display: none;
            width: 330px;
            max-width: 100%;
            aspect-ratio: 3 / 4;
            background: linear-gradient(160deg, #fbe0e8 0%, #dcefe1 100%);
        }
        .frame.empty img { display: none; }
        .frame.empty .ph { display: block; }

        /* ---------- Scroll reveal ---------- */
        .reveal {
            opacity: 0;
            transform: translateY(60px);
            transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal.revealed {
            opacity: 1;
            transform: none;
        }
        .frame.reveal:nth-child(2) { transition-delay: 0.15s; }
        .frame.reveal:nth-child(3) { transition-delay: 0.3s; }
        /* Panels unfold like a card being opened */
        .floating.reveal {
            transform: perspective(1400px) rotateX(-8deg) translateY(80px);
            transform-origin: top center;
        }
        .floating.reveal.revealed {
            transform: none;
        }

        /* ---------- Note to guests ---------- */
        .note-box h2 {
            text-align: center;
            font-family: 'Fleur De Leah', cursive;
            font-weight: 400;
            font-size: 44pt;
            color: #474e5d;
            margin-bottom: 0.75rem;
        }
        .note-box p {
            max-width: 560px;
            margin: 0 auto;
            line-height: 1.85;
            color: #474e5d;
        }

        /* ---------- RSVP form (pastel pinks and greens) ---------- */
        #rsvp {
            background: linear-gradient(155deg, #fdf1f4 0%, #eef7f0 100%);
        }
        #rsvp .rsvp-wrap {
            max-width: 640px;
            margin: 0 auto;
            color: #4d5a52;
        }
        #rsvp .rsvp-title {
            font-family: 'Fleur De Leah', cursive;
            font-size: 48pt;
            text-align: center;
            font-weight: 400;
            color: #b7677f;
            margin-bottom: 0.25rem;
        }
        #rsvp .rsvp-sub {
            text-align: center;
            font-style: italic;
            margin-bottom: 2rem;
        }
        #rsvp form {
            background-color: white;
            border: 1px solid #f5c6d3;
            border-top: 5px solid #a8d5ba;
            border-radius: 6px;
            padding: 2rem 2.25rem;
            box-shadow: 0 4px 22px rgba(183, 103, 127, 0.14);
        }
        #rsvp .field {
            margin-bottom: 1.5rem;
        }
        #rsvp label,
        #rsvp legend {
            display: block;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
            margin-bottom: 0.5rem;
            color: #4d5a52;
        }
        #rsvp .opt {
            font-weight: 400;
            font-style: italic;
            opacity: 0.7;
        }
        #rsvp fieldset {
            border: 0;
        }
        #rsvp input[type="text"],
        #rsvp input[type="email"],
        #rsvp textarea {
            width: 100%;
            padding: 0.75rem 0.9rem;
            font-family: "PT Serif", serif;
            font-size: 1rem;
            color: #4d5a52;
            background-color: #fdf7f9;
            border: 1px solid #f0cdd8;
            border-radius: 4px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }
        #rsvp textarea {
            min-height: 120px;
            resize: vertical;
        }
        #rsvp input:focus,
        #rsvp textarea:focus {
            outline: none;
            background-color: white;
            border-color: #8fc3a0;
            box-shadow: 0 0 0 3px rgba(143, 195, 160, 0.3);
        }
        #rsvp .party-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            animation: row-in 0.45s ease both;
        }
        #rsvp .party-row.solo {
            grid-template-columns: 1fr 1fr;
        }
        @keyframes row-in {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: none; }
        }
        #rsvp .remove-guest {
            width: 42px;
            font-size: 1.3rem;
            line-height: 1;
            color: #b7677f;
            background-color: #fdf1f4;
            border: 1px solid #f0cdd8;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.25s ease;
        }
        #rsvp .remove-guest:hover { background-color: #fbe0e8; }
        #rsvp .add-guest {
            display: inline-block;
            margin-top: 0.25rem;
            padding: 0.6rem 1.1rem;
            font-family: "PT Serif", serif;
            font-size: 0.95rem;
            color: #4d7a5e;
            background-color: transparent;
            border: 1px dashed #8fc3a0;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.25s ease;
        }
        #rsvp .add-guest:hover { background-color: #eef7f0; }
        #rsvp .add-guest:disabled { opacity: 0.45; cursor: not-allowed; }
        #rsvp .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        #rsvp .choice {
            position: relative;
            margin: 0;
        }
        #rsvp .choice input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        #rsvp .choice span {
            display: block;
            text-align: center;
            padding: 0.9rem 0.5rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            color: #4d5a52;
            background-color: #fdf7f9;
            border: 1px solid #f0cdd8;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        #rsvp .choice span:hover {
            border-color: #8fc3a0;
        }
        #rsvp .choice.yes input:checked + span {
            background-color: #c4e3cc;
            border-color: #8fc3a0;
            color: #2f5a40;
            font-weight: 700;
        }
        #rsvp .choice.no input:checked + span {
            background-color: #f5c6d3;
            border-color: #e79bb0;
            color: #7a3550;
            font-weight: 700;
        }
        #rsvp .choice input:focus-visible + span {
            box-shadow: 0 0 0 3px rgba(143, 195, 160, 0.45);
        }
        #rsvp .submit {
            display: block;
            width: 100%;
            padding: 0.95rem 1rem;
            font-family: "PT Serif", serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #254634;
            background-color: #a8d5ba;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        #rsvp .submit:hover { background-color: #8fc3a0; transform: translateY(-1px); }
        #rsvp .submit:disabled { opacity: 0.6; cursor: wait; }
        #rsvp .status {
            margin-top: 1rem;
            text-align: center;
            min-height: 1.4em;
        }
        #rsvp .status.error { color: #b0405f; }
        #rsvp .thanks {
            display: none;
            text-align: center;
            background-color: white;
            border: 1px solid #f5c6d3;
            border-top: 5px solid #a8d5ba;
            border-radius: 6px;
            padding: 3rem 2rem;
            box-shadow: 0 4px 22px rgba(183, 103, 127, 0.14);
        }
        #rsvp .thanks h3 {
            font-family: 'Fleur De Leah', cursive;
            font-weight: 400;
            font-size: 42pt !important;
            color: #b7677f;
            margin-bottom: 0.5rem;
        }
        #rsvp.sent form { display: none; }
        #rsvp.sent .thanks { display: block; animation: thanks-in 0.9s ease both; }
        @keyframes thanks-in {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: none; }
        }
        #rsvp .hp { position: absolute; left: -9999px; }

        @media screen and (max-width: 600px) {
            #unveil .seal .names { font-size: 38pt; }
            .site-nav { gap: 0.9rem; padding: 0.85rem 0.75rem; }
            .site-nav a { font-size: 0.72rem; letter-spacing: 0.08em; }
            .gallery { width: 88%; gap: 1.75rem; }
            .frame img { height: 340px; }
            .note-box h2 { font-size: 34pt; }
            #rsvp form { padding: 1.5rem 1.25rem; }
            #rsvp .rsvp-title { font-size: 38pt; }
        }

        /* ---------- Respect reduced-motion preferences ---------- */
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .reveal, .floating.reveal { opacity: 1; transform: none; transition: none; }
            #unveil .panel { transition: none; }
            .scroll-cue span, #unveil .seal .hint, #unveil .seal .ring { animation: none; }
            .site-nav { transition: opacity 0.2s ease; transform: none; }
        }
    </style>


    
    <body style="background-image: url('background-watercolor.jpg');">


        <!-- 2.5 Navigation banner -->
        <nav class="site-nav" id="site-nav" aria-label="Main navigation">
            <a href="wedding.html" data-spy="home">Home</a>
            <a href="schedule.html" data-spy="schedule">Schedule</a>
            <a href="https://www.amazon.com/wedding/share/omerso-2027" target="_blank" rel="noopener">Registry</a>
            <a href="FAQs.html" data-spy="faqs">FAQs</a>

        </nav>

        
        <div class="floating compact note-box" id="faqs">
            <h2>Schedule</h2>
            <p>Details coming soon.</p>
        </div>

        
    </body>
